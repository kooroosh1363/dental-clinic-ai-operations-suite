services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: novasmile
      POSTGRES_USER: novasmile
      POSTGRES_PASSWORD: local-development-only
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novasmile -d novasmile"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      PORT: 4000
      WEB_ORIGIN: http://localhost:8080
      JWT_SECRET: local-compose-secret-change-before-deploying
      DATABASE_URL: postgres://novasmile:local-development-only@postgres:5432/novasmile
      DRY_RUN_NOTIFICATIONS: "true"
    ports: ["4000:4000"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 10s
      timeout: 3s
      retries: 10
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args: { VITE_API_URL: "http://localhost:4000" }
    ports: ["8080:80"]
    depends_on:
      api: { condition: service_healthy }
volumes:
  postgres_data:
